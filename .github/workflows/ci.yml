name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:                      # same images as docker-compose.yml
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v