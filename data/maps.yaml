# Every known ranked map. in_pool: true = in the current ranked pool (used by the quiz).
# New season: add the new maps, flip in_pool; never delete a row (picks and chunks point to the ids).
# name: Fandom page title. aliases: other spellings (SpenLC screens, transcription errors), case-sensitive.
# types (1-2 of open/bushy/tight/lane) and features (closed list in draft_coach/maps.py): from the Fandom
#   Layout and Federico's observations, validated by Federico (Oct 2026).
# notes: Federico's observations; a brawler named in a note is a dated example, not the concept.

