- id: kaboom-canyon
  name: "Kaboom Canyon"
  mode: heist
  in_pool: true
  aliases: []
  types: [open, bushy]
  features: [water_split, breakable_key_walls]
  notes: >-
    Lakes separate the center from the rest of the map: long-range brawlers that can cross or shoot over water
    are ideal (e.g. Angelo, Oct 2026). The center is bushy, with a central wall that can be broken, and more
    bushes near the safe.

- id: safe-zone
  name: "Safe Zone"
  mode: heist
  in_pool: true
  aliases: []
  types: [open, lane]
  features: [water_split, center_only_path, indestructible_walls, exposed_objective]
  notes: >-
    Lakes split the map horizontally: without jumps or mobility abilities the only way through is the center.
    Bushes at safe height. Indestructible walls let a lobbed attack hit from safe cover (e.g. Penny's mortar,
    Oct 2026).

