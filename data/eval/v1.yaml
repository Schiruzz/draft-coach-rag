  reference: A gem carrier mid, a controller in lane, a brawler that pressures the enemy carrier and a damage defender; keep an anti-tank if they have last pick.
  gold:
  - {source: spenlc-knowing-matchups, start_s: 1191, end_s: 1334}
  - {source: idarkjoker-draft-guide, start_s: 279, end_s: 370}

- id: concept022
  type: concept
  lang: it
  question: In Gem Grab quando conviene scegliere il centrale?
  reference: 'Early in the draft: save the late picks for lane brawlers, assassins or throwers that counter the whole enemy comp.'
  gold:
  - {source: spenlc-knowing-matchups, start_s: 1264, end_s: 1294}

- id: concept023
  type: concept
  lang: en
  question: In Heist, why do you need a brawler just for safe damage?
  reference: 'Damage wins Heist: a team-wiping push onto the safe erases minutes of control; keep at least one safe-damage brawler and help it reach the safe.'
  gold:
  - {source: spenlc-knowing-matchups, start_s: 1334, end_s: 1453}

- id: concept024
  type: concept
  lang: it
  question: Come si drafta in Hot Zone?
  reference: 'Control and sustain: controllers paired with high-HP brawlers and healers that can sit on the zone; squishy snipers cannot hold it.'
  gold:
  - {source: spenlc-knowing-matchups, start_s: 1769, end_s: 1872}

- id: concept025
  type: concept
  lang: en
  question: How do you counter control brawlers?
  reference: Tanks and assassins win the 1v1 against their low damage, throwers and wall breakers deny their turrets, and supports with high-HP brawlers outlast them.
  gold:
  - {source: spenlc-knowing-matchups, start_s: 631, end_s: 721}

- id: habit010
  type: habit
  lang: it
  question: 'Mi piace giocare due control nella stessa squadra: è un problema?'
  reference: 'Two controls lack damage: the enemy just picks a tank they cannot take down.'
  gold:
  - {source: spenlc-knowing-matchups, start_s: 1896, end_s: 1923}

- id: concept026
  type: concept
  lang: it
  question: Cosa mi dicono i ban degli avversari?
  reference: Their bans reveal their plan, e.g. banning anti-throwers means they want a thrower; draft against what they are building.
  gold:
  - {source: idarkjoker-draft-guide, start_s: 372, end_s: 463}

- id: habit011
  type: habit
  lang: it
  question: 'Scelgo sempre il mio main, anche come primo pick: va bene?'
  reference: 'From Mythic, ego picking is a mistake: pick what is good on the map. In Diamond Gbab instead advises the brawler you master.'
  gold:
  - {source: idarkjoker-draft-guide, start_s: 534, end_s: 589}
  - {source: gbab-rank-by-rank-guide, start_s: 273, end_s: 317}

- id: plan007
  type: plan
  lang: en
  question: We have first pick. What should we ban?
  reference: Ban the brawlers that counter the first pick you plan, not the strongest brawler, which the enemy will ban anyway.
  gold:
  - {source: idarkjoker-draft-guide, start_s: 224, end_s: 277}


