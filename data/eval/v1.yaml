  gold:
  - {source: s4lamence-essential-draft-guide, start_s: 785, end_s: 845}

- id: plan003
  type: plan
  lang: en
  question: The enemy team always groups up together. What should we pick?
  reference: Against grouping, pick piercing attacks (Penny, Gigi), piercing supers (Rico, Mortis) or bouncing attacks (Belle, Jessie).
  gold:
  - {source: gbab-rank-by-rank-guide, start_s: 1852, end_s: 1911}

- id: concept008
  type: concept
  lang: en
  question: How should I ban when my team has first pick?
  reference: 'Ban the good last picks you cannot first pick yourself: assassins and tanks that would catch your team by surprise.'
  gold:
  - {source: s4lamence-essential-draft-guide, start_s: 100, end_s: 150}
  - {source: gbab-rank-by-rank-guide, start_s: 544, end_s: 578}

- id: concept009
  type: concept
  lang: it
  question: Cosa conviene bannare quando l'ultimo pick è nostro?
  reference: Ban the safest and most popular first picks, or the meta brawlers that are hard to counter.
  gold:
  - {source: s4lamence-essential-draft-guide, start_s: 152, end_s: 166}
  - {source: gbab-rank-by-rank-guide, start_s: 524, end_s: 544}

- id: concept010
  type: concept
  lang: en
  question: What makes a good first pick?
  reference: A brawler with as few counters as possible that does not die easily, especially to assassins; never assassins, throwers or squishy brawlers.
  gold:
  - {source: s4lamence-essential-draft-guide, start_s: 245, end_s: 337}

- id: concept011
  type: concept
  lang: it
  question: Cosa deve fare chi sceglie al quarto e al quinto pick?
  reference: Counter the enemy counters while covering the threat of their last pick, without a shared weakness.
  gold:
  - {source: s4lamence-essential-draft-guide, start_s: 355, end_s: 417}
  - {source: s4lamence-essential-draft-guide, start_s: 476, end_s: 509}
  - {source: gbab-rank-by-rank-guide, start_s: 1694, end_s: 1726}

- id: concept012
  type: concept
  lang: en
  question: What is the difference between a partial and a complete outdraft?
  reference: 'Partial: picks decent into the enemy that also synergise (2-3, 4-5 picks). Complete: the last pick counters the whole enemy comp, often an off-meta brawler.'
  gold:
  - {source: gbab-rank-by-rank-guide, start_s: 1667, end_s: 1765}

- id: concept013
  type: concept
  lang: it
  question: Chi batte chi tra tank, assassini, anti-tank, control, sniper e thrower?
  reference: Tanks and assassins beat controllers, snipers and throwers; anti-tanks and damage dealers beat tanks and assassins; controllers, snipers and throwers beat anti-tanks and damage dealers.
  gold:
  - {source: gbab-rank-by-rank-guide, start_s: 842, end_s: 1013}

- id: concept014
  type: concept
  lang: en
  question: Why does the type of map matter in the draft?
  reference: Closed, bushy, tight and open maps favour different brawlers; aggressive modes want damage, mobility or HP, passive modes range and control.
  gold:
  - {source: gbab-rank-by-rank-guide, start_s: 1032, end_s: 1094}
