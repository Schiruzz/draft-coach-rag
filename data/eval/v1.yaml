- id: habit012
  type: habit
  lang: it
  question: 'Gioco Max in Open Business perché è forte ovunque: va bene?'
  reference: 'Max is overrated there: no sustain and little threat behind walls; prefer brawlers that push behind walls with more health.'
  gold:
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 1436, end_s: 1460}

- id: habit013
  type: habit
  lang: it
  question: 'Su Center Stage giochiamo spesso tre brawler che fanno solo danno da lontano: è un errore?'
  reference: 'Yes: you need presence in the bushes and a scouting brawler with the vision gear, or one aggressive enemy sneaks through and overwhelms you.'
  gold:
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 404, end_s: 448}

- id: habit014
  type: habit
  lang: it
  question: 'Su ogni mappa con i cespugli prendo Emz anche da sola: sbaglio?'
  reference: 'Emz is easily outranged without support: pair her with Stu or Max; on a map like Hard Rock Mine she fails above Masters.'
  gold:
  - {source: spenlc-draft-positions, start_s: 1004, end_s: 1027}

- id: habit015
  type: habit
  lang: it
  question: 'In Hard Rock Mine al quinto pick non prendo mai un brawler aggressivo per paura dell''ultimo pick avversario: è giusto?'
  reference: 'No: on Hard Rock Mine you must have a pressure brawler anyway, or the enemy pushes you back and their carrier collects the gems.'
  gold:
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 890, end_s: 928}

- id: habit016
  type: habit
  lang: it
  question: 'Come primo pick prendo spesso un tank perché è forte: va bene?'
  reference: 'No: first picking a tank or an assassin is a mistake even when they are broken; assassins picked early are easy to counter.'
  gold:
  - {source: s4lamence-essential-draft-guide, start_s: 113, end_s: 122}
  - {source: spenlc-knowing-matchups, start_s: 123, end_s: 141}

- id: habit017
  type: habit
  lang: en
  question: I often pick Stu next to another low-damage brawler. Is that a problem?
  reference: 'Yes: two low-damage brawlers are the most common draft mistake; pair Stu with high damage.'
  gold:
  - {source: spenlc-draft-positions, start_s: 859, end_s: 889}
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 381, end_s: 404}

- id: habit018
  type: habit
  lang: it
  question: 'In Hot Zone prendo sempre Gray al secondo o terzo pick: è una buona idea?'
  reference: Gray at 2-3 is too early, Lou, Bo or Lumi counter the Gray cheese; it is stronger at 4-5, when only one counter is left.
  gold:
  - {source: spenlc-draft-positions, start_s: 2294, end_s: 2313}

- id: habit019
  type: habit
  lang: it
  question: 'Su Center Stage nessuno di noi usa la vision gear: conta anche nel draft?'
  reference: 'Yes: on Center Stage a scouting brawler with the vision gear is part of the draft, at least one, better two.'
  gold:
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 404, end_s: 437}

- id: habit020
  type: habit
  lang: it
  question: 'Quando abbiamo il primo pick bannamo sempre il brawler più forte: è giusto?'
  reference: 'No: with first pick, leave the strongest first pick open and take it; ban the broken assassins and tanks you cannot first pick yourself.'
  gold:
  - {source: ash-ranked-guide-s54, start_s: 2749, end_s: 2770}
  - {source: s4lamence-essential-draft-guide, start_s: 100, end_s: 150}

- id: plan008
  type: plan
  lang: it
  question: Su Safe Zone chi prendo come centrale e quando?
  reference: Pierce is the best mid; without him, leave the mid for last and counter the enemy mid (Belle, Piper, Angelo).
  gold:
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 1290, end_s: 1315}

- id: plan009
  type: plan
  lang: it
  question: Su Parallel Plays conviene giocare in due all'attacco e uno in difesa, o il contrario?
  reference: It depends on how much you trust your teammates; a lone defender needs a strong brawler with wall-peek tools (Colette, Charlie, Surge, Cordelius).
  gold:
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 1521, end_s: 1556}

- id: plan010
  type: plan
  lang: en
  question: On Triple Dribble, what do I need to check in our draft?
  reference: Enough pressure to deal with a thrower, a brawler that can pressure their thrower lane, and a goal-scoring super or hypercharge.
  gold:
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 706, end_s: 740}

- id: plan011
  type: plan
  lang: it
  question: 'Su Dueling Beetles l''avversario ha l''ultimo pick: cosa banno?'
  reference: Ban Barley, or the Gray plus Emz combination; pro teams left Barley open and got countered by a last-pick Barley.
  gold:
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 1396, end_s: 1423}

- id: plan012
  type: plan
  lang: it
  question: Su Hot Potato conviene difendere la cassaforte o attaccare di continuo?
  reference: One brawler defends consistently, one safe-damage brawler and one that keeps creating pressure; someone should always be alive pushing.
  gold:
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 1091, end_s: 1150}

- id: plan013
  type: plan
  lang: en
  question: What composition works on Kaboom Canyon?
  reference: A range brawler, an aggressive safe-damage brawler (Carl, Melodie, Kaze) and one brawler that holds control, with a follow-up for the safe damage.
  gold:
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 1181, end_s: 1256}

- id: plan014
  type: plan
  lang: it
  question: Su Ring of Fire quanti brawler devono stare sulla zona?
  reference: Two brawlers in the middle to guarantee zone time; do not worry too much about flankers, group up if needed.
  gold:
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 1601, end_s: 1625}

- id: plan015
  type: plan
  lang: en
  question: The enemy first picked Gray. What do we pick?
  reference: Something that does not feed the Gray teleport or has a lot of HP, or Otis and Meeple to punish the teleport (Finx, Max are options too).
  gold:
  - {source: idarkjoker-draft-guide, start_s: 795, end_s: 870}

- id: concept027
  type: concept
  lang: it
  covered: true
  question: Come countero Mico in Heist?
  reference: High HP or burst damage kills him (Bull, Doug); in Heist against Mico, Melodie or Kaze you need a brawler that stays at the safe and still deals damage (8-Bit, Nita, Colette).
  gold:
  - {source: bief-counters-every-brawler, start_s: 626, end_s: 633}
  - {source: ash-arthur-counter-meta, start_s: 366, end_s: 386}
  - {source: spenlc-hardest-counters, start_s: 2420, end_s: 2452}

- id: concept028
  type: concept
  lang: it
  covered: true
  question: Chi posso scegliere come counter di Gus o Wendy?
  reference: Against Wendy be aggressive, Ash is the best counter; against Gus, Edgar when his shield is down, Damian, or Byron and Mandy at range.
  gold:
  - {source: ash-arthur-counter-meta, start_s: 458, end_s: 466}
  - {source: bief-counters-every-brawler, start_s: 217, end_s: 226}
  - {source: spenlc-hardest-counters, start_s: 1613, end_s: 1670}

- id: concept029
  type: concept
  lang: en
  question: How do I counter Shade?
  reference: Open the map with a wall breaker in Knockout and Bounty; Lumi's slow and Meeple are the easiest counters; Lou, Hank or Jacky can work too.
  gold:
  - {source: ash-arthur-counter-meta, start_s: 510, end_s: 625}
  - {source: bief-counters-every-brawler, start_s: 420, end_s: 427}
  - {source: spenlc-hardest-counters, start_s: 3161, end_s: 3190}

- id: concept030
  type: concept
  lang: it
  question: Come si countera Amber?
  reference: 'Her barrels tank shots: pick piercing attacks (Janet) or Lumi; Starr Nova and Bonnie can also punish her.'
  gold:
  - {source: ash-arthur-counter-meta, start_s: 486, end_s: 510}
  - {source: bief-counters-every-brawler, start_s: 790, end_s: 805}
  - {source: spenlc-hardest-counters, start_s: 60, end_s: 98}

- id: concept031
  type: concept
  lang: it
  question: Come si countera Rico?
  reference: 'Break his walls: Colt, Griff, Brock or other wall breakers; on maps with unbreakable walls, a last-pick thrower or Kit.'
  gold:
  - {source: ash-arthur-counter-meta, start_s: 174, end_s: 231}
  - {source: bief-counters-every-brawler, start_s: 175, end_s: 184}
  - {source: spenlc-hardest-counters, start_s: 2994, end_s: 3049}

- id: concept032
  type: concept
  lang: en
  question: Who counters Edgar?
  reference: 'High-DPS brawlers he cannot out-heal: Otis, Griff, Bull, Gale.'
  gold:
  - {source: bief-counters-every-brawler, start_s: 299, end_s: 305}
  - {source: spenlc-hardest-counters, start_s: 1160, end_s: 1197}

- id: concept033
  type: concept
  lang: it
  question: Come countero Ash?
  reference: 'There is no single hard counter: use several counters (Emz, Lumi), Rico on maps with walls, or tanks like Frank, Damian and Trunk.'
  gold:
  - {source: ash-arthur-counter-meta, start_s: 153, end_s: 174}
  - {source: bief-counters-every-brawler, start_s: 346, end_s: 353}
  - {source: spenlc-hardest-counters, start_s: 135, end_s: 170}

- id: concept034
  type: concept
  lang: en
  question: How do you counter Max compositions?
  reference: 'Lumi and Meeple: slows, stuns and Meeple''s box shut down the speed.'
  gold:
  - {source: ash-arthur-counter-meta, start_s: 301, end_s: 327}
  - {source: spenlc-hardest-counters, start_s: 2267, end_s: 2320}

- id: concept035
  type: concept
  lang: it
  question: Come si countera Nori?
  reference: Anti-tanks like Maisie and Colette; Meg is underrated with her HP; the counters to Kenji also counter Nori.
  gold:
  - {source: ash-arthur-counter-meta, start_s: 64, end_s: 92}

- id: concept036
  type: concept
  lang: en
  question: How do I counter Cosmo?
  reference: 'His close-range DPS is low and his super is high risk: almost any aggro brawler counters him; mid-range brawlers like Emz, Lumi or Meg also do well.'
  gold:
  - {source: ash-arthur-counter-meta, start_s: 662, end_s: 683}

- id: concept037
  type: concept
  lang: it
  question: Come countero Bolt?
  reference: Chester, maybe Doug, and Lou above all.
  gold:
  - {source: bief-counters-every-brawler, start_s: 438, end_s: 450}
  - {source: bren-tier-list-s55, start_s: 300, end_s: 313}

- id: concept038
  type: concept
  lang: en
  question: Who counters Damian?
  reference: Otis above all, Edgar can out-heal him, and Colette because he is a tank.
  gold:
  - {source: bief-counters-every-brawler, start_s: 752, end_s: 761}

- id: concept039
  type: concept
  lang: it
  covered: true
