  lang: it
  covered: true
  question: Perché perdo sempre in Arraffa gemme? Sembra che ci battano sempre.
  reference: 'Draft side only (in-game play is not covered): a mid gem carrier picked early, a controller, a pressure brawler that reaches their carrier, and an anti-tank defender; do not take two brawlers
    with the same role.'
  gold:
  - {source: spenlc-knowing-matchups, start_s: 1191, end_s: 1334}
