  gold:
  - {source: bobbybs-draft-guide, start_s: 652, end_s: 718}

- id: habit003
  type: habit
  lang: it
  question: 'Prendo sempre Piper in Hot Zone: è per questo che perdo?'
  reference: 'Pure snipers like Piper are hardly seen anymore: low damage and too much skill needed, almost impossible in aggressive modes; the exceptions are Belle, Angelo and Pierce.'
  gold:
  - {source: bobbybs-draft-guide, start_s: 1272, end_s: 1295}
  - {source: bobbybs-draft-guide, start_s: 1418, end_s: 1445}

