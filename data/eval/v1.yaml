  gold:
  - {source: spenlc-knowing-matchups, start_s: 94, end_s: 141}

- id: concept019
  type: concept
  lang: en
  question: Which kinds of brawlers make the best last picks?
  reference: Throwers, tanks and assassins counter whole compositions; controllers can be good last picks too.
  gold:
  - {source: spenlc-knowing-matchups, start_s: 181, end_s: 214}

- id: plan006
  type: plan
  lang: it
  question: 'Il mio compagno ha preso un assassino molto presto: cosa scelgo?'
