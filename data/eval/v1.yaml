- id: concept015
  type: concept
  lang: en
  question: Why can two strong picks still make a weak team?
  reference: 'The two-rocks problem: if both picks lose to the same thing, the enemy needs only one answer; ask what your team already has and what it lacks.'
  gold:
  - {source: yukibs-drafting-mistakes, start_s: 236, end_s: 323}

