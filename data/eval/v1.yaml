  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 55, end_s: 79}

- id: plan017
  type: plan
  lang: it
  covered: true
  question: 'Ho pochi brawler a 11 con buffie e overdrive e gli avversari sembrano sempre più forti: come mi organizzo?'
  reference: Build a roster of 2-3 brawlers per class, upgrade the flexible ones first, keep comfort picks; from Masters you need most meta brawlers maxed with good builds.
  gold:
  - {source: gbab-rank-by-rank-guide, start_s: 361, end_s: 374}
  - {source: gbab-rank-by-rank-guide, start_s: 665, end_s: 679}
  - {source: gbab-rank-by-rank-guide, start_s: 1550, end_s: 1560}
  - {source: spenlc-knowing-matchups, start_s: 1013, end_s: 1191}

- id: plan018
  type: plan
  lang: it
  covered: true
  question: 'Gli avversari sembrano sempre più di squadra: giocando in solitario come rimedio nel draft?'
  reference: 'Draft side only (in-game teamwork is not covered): react to your teammates'' picks and cover the weaknesses they leave; if a teammate picks badly, counter the enemy''s counter.'
  gold:
  - {source: spenlc-knowing-matchups, start_s: 214, end_s: 246}
  - {source: bobbybs-draft-guide, start_s: 2522, end_s: 2625}

- id: habit023
  type: habit
  lang: it
  covered: true
  question: Perché perdo sempre in Brawl Ball?
  reference: 'Draft side only: first pick the best anti-tank, then a space maker or a tank against their space makers; never play without an anti-tank; have presence in the bushes.'
  gold:
  - {source: bobbybs-draft-guide, start_s: 1842, end_s: 1975}
  - {source: spenlc-knowing-matchups, start_s: 1531, end_s: 1670}
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 409, end_s: 466}

- id: habit024
  type: habit
  lang: it
  covered: true
  question: Perché perdo sempre in Rapina?
  reference: 'Draft side only: damage wins Heist; keep at least one safe-damage brawler and only one aggro brawler; against a Chuck, out-damage him instead of defending.'
  gold:
  - {source: spenlc-knowing-matchups, start_s: 1334, end_s: 1453}
  - {source: bobbybs-draft-guide, start_s: 2092, end_s: 2233}
  - {source: spenlc-draft-positions, start_s: 2095, end_s: 2135}

- id: habit025
  type: habit
  lang: it
  covered: true
  question: Perché perdo sempre in Zona calda?
  reference: 'Draft side only: Hot Zone is control and sustain; two brawlers on the zone, high HP and healing; squishy snipers cannot hold it.'
  gold:
  - {source: spenlc-knowing-matchups, start_s: 1769, end_s: 1872}
  - {source: bobbybs-draft-guide, start_s: 1982, end_s: 2046}
  - {source: spenlc-ranked-cheat-sheet-s54, start_s: 1601, end_s: 1625}

- id: plan019
  type: plan
  lang: it
  covered: true
  question: 'In Diamante gli avversari prendono sempre Edgar e Mortis: chi scelgo alla cieca?'
  reference: Ban the assassins you hate facing; pick an anti-tank you master, Diamond is full of tanks and assassins; Otis, Bull and Griff beat Edgar and Mortis.
  gold:
  - {source: gbab-rank-by-rank-guide, start_s: 245, end_s: 335}
  - {source: bief-counters-every-brawler, start_s: 299, end_s: 305}
  - {source: bief-counters-every-brawler, start_s: 449, end_s: 455}

- id: plan020
  type: plan
  lang: it
  covered: true
  question: 'Non ho brawler del meta a livello 11: cosa scelgo come primo pick?'
  reference: The least counterable brawler that does not die easily, preferably an anti-tank; a solid comfort pick beats a meta pick you cannot play.
  gold:
  - {source: s4lamence-essential-draft-guide, start_s: 245, end_s: 337}
  - {source: bobbybs-draft-guide, start_s: 834, end_s: 846}
  - {source: gbab-rank-by-rank-guide, start_s: 665, end_s: 679}

- id: plan021
  type: plan
  lang: it
  covered: true
  question: 'I miei compagni bannano a caso: cosa banno io?'
  reference: Hold the most important ban (the strongest brawler for that pick order); if a teammate already banned it, ban the next one.
  gold:
  - {source: idarkjoker-draft-guide, start_s: 166, end_s: 181}
  - {source: gbab-rank-by-rank-guide, start_s: 517, end_s: 585}

- id: concept041
  type: concept
  lang: it
  covered: true
  question: A che rank il meta conta davvero?
  reference: Below Masters the concept and comfort picks matter more; the meta weighs with full builds and at high ranks (e.g. Mico is hard to counter in Mythic and Legendary, easy for pros).
