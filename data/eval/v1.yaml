  - {source: gbab-rank-by-rank-guide, start_s: 1101, end_s: 1121}
  - {source: gbab-rank-by-rank-guide, start_s: 1550, end_s: 1560}
  - {source: spenlc-tier-list-s55, start_s: 150, end_s: 165}

