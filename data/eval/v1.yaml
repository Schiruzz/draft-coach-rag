- id: plan016
  type: plan
  lang: it
  covered: true
  question: 'A Mitico gli avversari si sono presi Amber e Shade: c''era modo di counterarli?'
  reference: 'Amber: piercing attacks (Janet) or Lumi. Shade: Lumi or Meeple, and wall breakers to open the map. If the enemy has first pick, ban them before.'
  gold:
  - {source: ash-arthur-counter-meta, start_s: 486, end_s: 625}
  - {source: bief-counters-every-brawler, start_s: 420, end_s: 427}
  - {source: ash-ranked-guide-s54, start_s: 5557, end_s: 5572}

- id: habit022
  type: habit
  lang: it
  covered: true
  question: A Mitico devo sempre bannare i brawler del meta?
  reference: 'It depends on pick order: if they have first pick, ban the strongest first picks (Amber, Shade, Gus or Wendy); if you have first pick, ban strong last picks and the broken assassins and tanks
    you cannot first pick yourself.'
  gold:
  - {source: gbab-rank-by-rank-guide, start_s: 517, end_s: 585}
  - {source: s4lamence-essential-draft-guide, start_s: 100, end_s: 166}
