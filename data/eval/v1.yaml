  type: habit
  lang: it
  question: 'Gioco sempre il mio brawler preferito senza guardare il meta: è un problema?'
  reference: 'Yes: a brawler''s strength changes with balance changes; follow pro tier lists and balance videos.'
  gold:
  - {source: bobbybs-draft-guide, start_s: 2467, end_s: 2515}

- id: plan002
  type: plan
  lang: it
  question: 'Il mio compagno ha preso Mortis come primo pick: come rimedio nel draft?'
  reference: 'Counter their counter: they will answer the Mortis with anti-tanks, so pick what beats those anti-tanks instead of another tank.'
  gold:
  - {source: bobbybs-draft-guide, start_s: 2533, end_s: 2580}

- id: concept002
  type: concept
  lang: it
  question: Cos'è un anti-tank e perché si prende come primo pick?
  reference: The most well-rounded class with almost no weakness; in aggressive modes the best first pick is the best available anti-tank.
  gold:
  - {source: bobbybs-draft-guide, start_s: 810, end_s: 846}

- id: concept003
  type: concept
  lang: en
  question: What is the difference between a tank and a space maker?
  reference: Both have HP and close-range damage, but a tank cannot close the distance; Bull counts as a space maker because he can.
  gold:
  - {source: bobbybs-draft-guide, start_s: 1436, end_s: 1478}

- id: concept004
  type: concept
  lang: it
  question: Perché un support da solo non basta a vincere?
  reference: 'Supports cover the team''s weaknesses but do little damage: pair them with a damage dealer or a damaging tank.'
  gold:
  - {source: bobbybs-draft-guide, start_s: 1692, end_s: 1734}

- id: concept005
  type: concept
  lang: en
  question: When is it safe to pick a control brawler?
  reference: In the 2-3 or 4-5 picks, once the team already has an anti-tank; never first pick.
  gold:
  - {source: bobbybs-draft-guide, start_s: 1176, end_s: 1216}

- id: concept006
  type: concept
  lang: en
  question: Why is an anti-tank plus a space maker such a strong combination?
  reference: The anti-tank sets up the space maker, and the space maker in the 4-5 picks denies the enemy a last-pick thrower or sniper.
  gold:
  - {source: bobbybs-draft-guide, start_s: 944, end_s: 957}
  - {source: bobbybs-draft-guide, start_s: 2016, end_s: 2028}

- id: concept007
