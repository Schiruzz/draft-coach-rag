- id: 823f8fc1707e84b4f2dd2ea75bb51ae2e30ca0f881d0c2667ef977b3a7f04c18:1
  source: yukibs-drafting-mistakes
  link: https://www.youtube.com/watch?v=wUdCUvTSmuE&t=356s
  quote: So, your third pick should probably change the shape of your team. Someone who holds up against aggression. Someone
    mobile who can expate, escape, or punish a dive. Someone solid at mid-range. You don't need one exact role every time.
    You just need that third pick to make it harder for one enemy brawler to beat your whole team by itself.
  concept: A team's third pick should diversify its composition by handling aggression or mobility to prevent a single counter.
  reason: It prevents the opponent's final pick from defeating the entire team alone.
  topic: class_concept
  relation: none
