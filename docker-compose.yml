# Local databases: MongoDB is the source of truth, Qdrant is the derived vector index.
services:
  mongodb:
    image: mongo:8.0
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]          # named volume: data survives container restarts

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["6333:6333"]                    # REST API
    volumes: [qdrant_data:/qdrant/storage]

volumes:
  mongo_data:
  qdrant_data: