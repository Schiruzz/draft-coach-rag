[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "draft-coach-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.10",
    "qdrant-client~=1.19",   # same minor version as the Qdrant server
    "python-dotenv>=1.0",
    "pyyaml>=6.0",           # sources.yaml
    "requests>=2.32",        # wiki API
    "mwparserfromhell>=0.6", # wikitext -> plain text
    "google-genai>=2.31",    # Gemini API (structured output)
    "tqdm>=4.66",            # progress bars
    "google-cloud-discoveryengine>=0.20",  # Vertex AI ranking API (step 7b reranker)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]